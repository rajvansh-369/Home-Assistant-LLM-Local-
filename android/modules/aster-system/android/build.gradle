plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.astersystem'
version = '0.1.0'

android {
  namespace "expo.modules.astersystem"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // The "Hey Aster" wake word: openWakeWord's ONNX models (docs/aster-voice-plan.md §6).
  implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'

  // The pure alert and message rules (AlertRules.kt, MessageText.kt): gradlew :aster-system:testDebugUnitTest
  testImplementation 'junit:junit:4.13.2'
}
